<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ถ่ายทอดสดการจราจร กรุงเทพฯ | Bangkok Traffic Live</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'Inter', 'sans-serif'],
            mono: ['Inter', 'monospace'],
          },
          colors: {
            brand: {
              rose: '#f43f5e',
              emerald: '#10b981',
              amber: '#f59e0b',
              dark: '#0b0f19',
              card: '#111827',
              border: '#1e293b'
            }
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-rose-500 selection:text-white">

  <header class="sticky top-0 z-40 glass-nav shadow-xl">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-rose-500 to-orange-500 flex items-center justify-center shadow-lg shadow-rose-600/30">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-white leading-tight">ถ่ายทอดสดการจราจร กรุงเทพฯ</h1>
          <p class="text-[11px] sm:text-xs text-slate-400">วิดีโอสดจากกล้องบนถนนในเมือง</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <span id="clock" class="px-3 py-1.5 rounded-xl bg-slate-900/90 border border-slate-800 text-xs font-mono text-slate-300"></span>
        <span id="camera-count" class="px-3 py-1.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-xs font-semibold text-emerald-300"></span>
        <button id="btn-refresh" class="px-3 py-1.5 rounded-xl bg-slate-900/90 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800 cursor-pointer">
          โหลดใหม่
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-[1600px] w-full mx-auto px-4 sm:px-6 py-5">
    <div id="camera-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      <div class="col-span-full py-20 text-center text-slate-400 text-sm">กำลังโหลดกล้อง...</div>
    </div>
  </main>

  <footer class="border-t border-slate-800/80 py-4">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 text-[11px] text-slate-500 leading-relaxed">
      <p id="source-note">ภาพจากกล้องของ iTIC Motion และกรมทางหลวง เผยแพร่ผ่านระบบแผนที่ Longdo</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.12"></script>
  <script src="/js/app.js"></script>
</body>
</html>
