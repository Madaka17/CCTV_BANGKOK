<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ถ่ายทอดสดการจราจร กรุงเทพฯ | Bangkok Traffic Live</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'Inter', 'sans-serif'],
            mono: ['Inter', 'monospace'],
          },
          colors: {
            brand: {
              rose: '#f43f5e',
              emerald: '#10b981',
              amber: '#f59e0b',
              dark: '#0b0f19',
              card: '#111827',
              border: '#1e293b'
            }
          }
        }
      }
    }
  </script>

  <link href="/css/maplibre-gl.css" rel="stylesheet" />
  <script src="/js/maplibre-gl.js"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-[#0b0f19] text-slate-100 font-sans min-h-screen flex flex-col antialiased selection:bg-rose-500 selection:text-white">

  <header class="sticky top-0 z-40 glass-nav shadow-xl">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-rose-500 to-orange-500 flex items-center justify-center shadow-lg shadow-rose-600/30">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold text-white leading-tight">ถ่ายทอดสดการจราจร กรุงเทพฯ</h1>
          <p class="text-[11px] sm:text-xs text-slate-400">วิดีโอสดจากกล้องบนถนนในเมือง</p>
        </div>
      </div>

      <nav class="flex items-center space-x-1 bg-slate-900/90 p-1 rounded-2xl border border-slate-800 shadow-inner order-3 sm:order-none">
        <button id="tab-cams" class="view-tab px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center space-x-1.5 text-white bg-rose-600 shadow-md shadow-rose-600/30 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
          <span>กล้องสด</span>
        </button>
        <button id="tab-map" class="view-tab px-3 py-1.5 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center space-x-1.5 text-slate-400 hover:text-white hover:bg-slate-800 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" /></svg>
          <span>แผนที่จราจร</span>
        </button>
      </nav>

      <div class="flex items-center space-x-2">
        <span id="clock" class="px-3 py-1.5 rounded-xl bg-slate-900/90 border border-slate-800 text-xs font-mono text-slate-300"></span>
        <span id="camera-count" class="px-3 py-1.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-xs font-semibold text-emerald-300"></span>
        <span id="playing-count" class="px-3 py-1.5 rounded-xl bg-slate-900/90 border border-slate-800 text-xs font-mono text-slate-400"></span>
        <select id="max-playing" title="จำนวนกล้องที่เล่นพร้อมกัน" class="px-2 py-1.5 rounded-xl bg-slate-900/90 border border-slate-800 text-xs text-slate-300 cursor-pointer">
          <option value="1">เล่นทีละ 1</option>
          <option value="2">พร้อมกัน 2</option>
          <option value="3" selected>พร้อมกัน 3</option>
          <option value="6">พร้อมกัน 6</option>
          <option value="19">ทั้งหมด</option>
        </select>
        <span id="vehicle-total" class="hidden px-3 py-1.5 rounded-xl bg-sky-500/15 border border-sky-500/30 text-xs font-semibold text-sky-300"></span>
        <span id="focus-badge" class="hidden px-3 py-1.5 rounded-xl bg-emerald-500/15 border border-emerald-500/30 text-xs font-semibold text-emerald-300"></span>
        <button id="btn-overlay" class="px-3 py-1.5 rounded-xl bg-rose-600 border border-slate-800 text-xs font-semibold text-white hover:opacity-90 cursor-pointer">ซ่อนกรอบ</button>
        <button id="btn-refresh" class="px-3 py-1.5 rounded-xl bg-slate-900/90 border border-slate-800 text-xs font-semibold text-slate-300 hover:text-white hover:bg-slate-800 cursor-pointer">
          โหลดใหม่
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-[1600px] w-full mx-auto px-4 sm:px-6 py-5">
    <div id="view-cams">
      <div id="camera-grid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
        <div class="col-span-full py-20 text-center text-slate-400 text-sm">กำลังโหลดกล้อง...</div>
      </div>
    </div>

    <div id="view-map" class="hidden space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-3 p-3 bg-slate-900/90 rounded-2xl border border-slate-800">
        <div class="flex items-center gap-4 text-xs">
          <span class="flex items-center gap-1.5"><span class="w-4 h-1.5 rounded-full" style="background:#54C00C"></span>คล่องตัว</span>
          <span class="flex items-center gap-1.5"><span class="w-4 h-1.5 rounded-full" style="background:#FEDE04"></span>ชะลอตัว</span>
          <span class="flex items-center gap-1.5"><span class="w-4 h-1.5 rounded-full" style="background:#FF2020"></span>ติดขัด</span>
          <span class="text-slate-500 hidden sm:inline">| หมุดแดง = กล้องสด คลิกเพื่อดู</span>
        </div>
        <div class="flex items-center gap-2">
          <span id="traffic-index" class="px-2.5 py-1 rounded-lg bg-slate-800 text-xs text-slate-300"></span>
          <span id="traffic-updated" class="text-[11px] text-slate-500"></span>
        </div>
      </div>
      <div id="map" class="w-full rounded-2xl overflow-hidden border border-slate-800" style="height:72vh"></div>
    </div>
  </main>

  <!-- Camera detail: what the detector saw, and the live stream -->
  <div id="detail" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm p-3 sm:p-6 overflow-y-auto">
    <div class="max-w-5xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
      <div class="flex items-start justify-between gap-3 p-4 border-b border-slate-800">
        <div class="min-w-0">
          <h2 id="detail-title" class="text-base font-bold text-white leading-snug truncate"></h2>
          <p id="detail-org" class="text-[11px] text-slate-500 mt-0.5"></p>
        </div>
        <button id="detail-close" class="shrink-0 p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 cursor-pointer" title="ปิด">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="px-4 pt-3 flex items-center gap-2">
        <button id="detail-tab-det" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-rose-600 text-white cursor-pointer">ผลตรวจจับ</button>
        <button id="detail-tab-live" class="px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 cursor-pointer">วิดีโอสด</button>
        <span id="detail-age" class="ml-auto text-[11px] text-slate-500"></span>
      </div>

      <div class="p-4">
        <div class="relative bg-black rounded-xl overflow-hidden aspect-video flex items-center justify-center">
          <img id="detail-img" class="w-full h-full object-contain" alt="" />
          <video id="detail-video" class="w-full h-full object-contain hidden" muted playsinline controls></video>
          <div id="detail-overlay" class="absolute inset-0 pointer-events-none"></div>
          <div id="detail-msg" class="absolute inset-0 flex items-center justify-center text-sm text-slate-400 pointer-events-none"></div>
        </div>

        <div id="detail-counts" class="mt-4 flex flex-wrap gap-2"></div>
        <p id="detail-note" class="mt-3 text-[11px] text-slate-500 leading-relaxed"></p>
      </div>
    </div>
  </div>

  <footer class="border-t border-slate-800/80 py-4">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 text-[11px] text-slate-500 leading-relaxed">
      <p><span id="build" class="text-slate-600"></span></p>
      <p id="source-note">ภาพจากกล้องของ iTIC Motion และกรมทางหลวง เผยแพร่ผ่านระบบแผนที่ Longdo</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.12"></script>
  <script src="/js/app.js"></script>
</body>
</html>
